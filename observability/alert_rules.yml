groups:
  - name: application
    rules:
      # alerte si plus de 5% des requetes finissent en erreur 5xx
      - alert: TauxErreur5xxEleve
        # erreurs 5xx par seconde / total des requetes par seconde, sur 1 min
        expr: >
          sum(rate(http_requests_total{code=~"5.."}[1m]))
          /
          sum(rate(http_requests_total[1m]))
          > 0.05
        # faut que ca dure 1 min pour eviter les fausses alertes sur un pic
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx superieur a 5%"
          description: "Plus de 5% des requetes renvoient une erreur 5xx depuis 1 minute."

      # alerte si 5% des requetes les plus lentes depassent 500ms
      - alert: LatenceP95Degradee
        # p95 calcule avec les buckets de l'histogram, par route (endpoint)
        # fenetre de 5 min pour lisser les variations
        expr: >
          histogram_quantile(0.95,
            sum by (le, endpoint) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        # plus tolerant que les erreurs, l'app repond quand meme
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 degradee"
          description: "Le p95 depasse 500ms depuis 2 minutes."