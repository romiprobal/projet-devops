name: CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy & Verify
    runs-on: self-hosted 
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Save previous commit SHA
        id: prev-sha
        run: echo "PREV_SHA=$(git rev-parse HEAD~1)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (Multi-tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy via Docker Compose
        run: |
          docker compose pull
          docker compose up -d

      - name: Healthcheck & Rollback
        run: |
          RETRIES=3
          DELAY=5
          SUCCESS=false

          for i in $(seq 1 $RETRIES); do
            if curl -f http://localhost:5000/health; then
              SUCCESS=true
              break
            fi
            sleep $DELAY
          done

          if [ "$SUCCESS" = false ]; then
            echo "Healthcheck échoué. Lancement du Rollback..."
            git checkout ${{ env.PREV_SHA }}
            docker compose up --build -d
            exit 1
          fi