name: CI Pipeline

on:
  # sur chaque push et chaque pr vers main
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # permet a la cd d'appeler ce workflow
  workflow_call:

# token en lecture seule, la ci a pas besoin d'ecrire
permissions:
  contents: read

jobs:
  # verifie le style des yaml et du python
  lint:
    name: Lint & YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # mode relaxed + on desactive les regles juste esthetiques
      - name: Lint YAML (yamllint)
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {new-lines: disable, trailing-spaces: disable, line-length: disable, new-line-at-end-of-file: disable}}" .

      - name: Lint Python (ruff)
        uses: chartboost/ruff-action@v1

  # lance les tests pytest
  test:
    name: Test (Python ${{ matrix.python-version }})
    # pas de tests si le lint a echoue
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # un job par version de python, en parallele
    strategy:
      # si une version plante on laisse l'autre finir
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # vraie bdd postgres pour le test /health
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # github attend que postgres soit pret avant de lancer les steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # notre action composite : python + cache pip + install
      - name: Setup (action locale, avec cache)
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      # meme user/mdp/base que le service postgres au dessus
      - name: Run Tests with Pytest
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: pytest --junitxml=test-results-${{ matrix.python-version }}.xml

      # always() pour avoir le rapport meme si les tests plantent
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

  # recupere les rapports des 2 versions
  report:
    name: Rapport de tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # merge-multiple met tous les fichiers dans le meme dossier
      - name: Download des rapports
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Lister les rapports récupérés
        run: ls -la *.xml

  # verifie que l'image docker se construit
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push false = dry run, on construit mais on envoie rien
      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: projet-devops:test

  # un seul check a mettre obligatoire dans la protection de branche
  ci-ok:
    name: CI Success Gate
    needs: [lint, test, report, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier que tous les jobs sont verts
        run: |
          # si un job a echoue ou a ete annule on bloque le merge
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Au moins un job a échoué — merge bloqué"
            exit 1
          fi
          echo "Tous les jobs de la CI sont verts."